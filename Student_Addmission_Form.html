<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Admission Form</title>

  <style>
    body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background-color: #f5f5f5;
}

.container {
  max-width: 6500px;
  margin: 0 auto;
  background-color: #fff;
  padding: 30px;
  border-radius: 5px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

p {
  text-align: center;
  color: #888;
}

.form-group {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}

input[type="text"],
input[type="email"],
input[type="tel"] {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 3px;
}

select {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 3px;
}

textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 3px;
  resize: vertical;
}

button {
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  float: right;
}

button:hover {
  background-color: #3e8e41;
}

.header {
  display: flex;
  align-items: center;
  padding: 15px 30px;
  background-color: #85f3fb;
  border-bottom: 1px solid #ccc;
}

.header img {
  width: 100px;
  height: auto;
  margin-right: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

p {
  text-align: center;
  color: #888;
}

.form-group {
  margin-bottom: 15px;
}

  </style>
</head>
<body>
  <header class="header" >
    <img src="/Web_Technology/ABES_logo.jpeg" alt="[College Name] Logo">
    <h1>ABES Engineering College</h1>
  </header>
    <div class="container">
        <h1>Admission Form</h1>
        <form action="#">
          <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required>
          </div>
          <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
          </div>

          <div class="form-group">
            <label for="program">Select State: </label>
            <select id="indianStates">
                <option value="">Select State</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                <option value="Assam">Assam</option>
                <option value="Bihar">Bihar</option>
                <option value="Delhi">Delhi</option>
                <option value="Haryana">Haryana</option>
                <option value="Jammu & Kashmir">Jammu &amp; Kashmir</option>
                <option value="Jharkhand">Jharkhand</option>
                <option value="Uttrakhand">Uttrakhand</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Other">Other</option>
              </select>
          </div>

          <div class="form-group">
            <label for="city">City:</label>
            <input type="text" id="city" name="city">
          </div>

          <div class="form-group">
          <h4>Appeared in JEE exam:</h4>
          <input type="radio" name="answer" value="yes">YES
          <input type="radio" name="answer" value="no">NO
          </div>
          

          <div class="form-group">
            <label for="rank">JEE Rank:</label>
            <input type="number" id="rank" name="rank">
          </div>

          <div class="form-group">
            <label for="percentage">10th Percentage:</label>
            <input type="percentage" id="10th" name="percentage">
          </div>

          <div class="form-group">
            <label for="percentage">12th Percentage:</label>
            <input type="percentage" id="12th" name="percentage">
          </div>

          <div class="form-group">
            <label for="program">Select Course:</label>
            <select id="program" name="program">
              <option value="">Select a Course</option>
              <option value="B.Tech">B.Tech</option>
              <option value="MBA">MBA</option>
              <option value="MCA">MCA</option>
            </select>
          </div>

          <label for="program">Select Branch of Interest:</label>
          <select id="program" name="program">
            <option value="">Select Branch</option>
            <option value="computerScienceEngineering">Computer Science and Engineering</option>
            <option value="information technology"> Information Technology (I.T) </option>
            <option value="Electrical Engineering">Electrical Engineering</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
          </select>
        </div>

          <button type="submit">Submit Application</button>
        </form>
      </div>
</body>
</html>
